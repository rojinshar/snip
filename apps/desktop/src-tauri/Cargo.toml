[package]
name = "snip-desktop"
version = "0.5.0"
description = "Snip: screenshot any equation, paste LaTeX"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "snip_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
# Blocking HTTP client: snips already run on a worker thread.
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PNG decode/resize/encode only.
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
