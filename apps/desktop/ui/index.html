<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snip Settings</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main>
      <section class="row">
        <div>
          <h2 id="hotkey-label">Hotkey</h2>
          <p class="hint">Click, then press the new keys. Esc cancels.</p>
        </div>
        <button id="hotkey" type="button" class="hotkey" aria-labelledby="hotkey-label"></button>
      </section>

      <fieldset id="delimiters">
        <legend>Paste as</legend>
        <label>
          <input type="radio" name="delimiters" value="inlineDollar" />
          <span>Inline <code>$…$</code></span>
        </label>
        <label>
          <input type="radio" name="delimiters" value="displayBracket" />
          <span>Display <code>\[…\]</code></span>
        </label>
        <label>
          <input type="radio" name="delimiters" value="displayDollar" />
          <span>Display <code>$$…$$</code></span>
        </label>
        <label>
          <input type="radio" name="delimiters" value="none" />
          <span>Plain LaTeX</span>
        </label>
      </fieldset>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
