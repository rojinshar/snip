<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snip Settings</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main>
      <section class="panel" aria-labelledby="key-label">
        <div class="row">
          <div>
            <h2 id="key-label">Access key</h2>
            <p id="key-state" class="hint">Not set</p>
          </div>
          <button id="key-remove" type="button" class="link" hidden>Remove</button>
        </div>
        <form id="key-form" class="key-form">
          <input
            id="key-input"
            type="password"
            placeholder="Paste your snip_ key"
            autocomplete="off"
            spellcheck="false"
            aria-labelledby="key-label"
          />
          <button type="submit">Save</button>
        </form>
      </section>

      <section class="panel row">
        <div>
          <h2 id="hotkey-label">Hotkey</h2>
          <p class="hint">Click, then press new keys.</p>
        </div>
        <button id="hotkey" type="button" class="hotkey" aria-labelledby="hotkey-label"></button>
      </section>

      <section class="panel" role="radiogroup" aria-labelledby="delimiters-label">
        <h2 id="delimiters-label">Paste as</h2>
        <label class="option">
          <input type="radio" name="delimiters" value="inlineDollar" />
          <span>Inline <code>$…$</code></span>
          <small>Inside a sentence</small>
        </label>
        <label class="option">
          <input type="radio" name="delimiters" value="displayBracket" />
          <span>Display <code>\[…\]</code></span>
          <small>On its own line, in LaTeX documents</small>
        </label>
        <label class="option">
          <input type="radio" name="delimiters" value="displayDollar" />
          <span>Display <code>$$…$$</code></span>
          <small>On its own line, in Markdown and Obsidian</small>
        </label>
        <label class="option">
          <input type="radio" name="delimiters" value="none" />
          <span>Plain LaTeX</span>
          <small>No delimiters, for pasting into an existing equation</small>
        </label>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
