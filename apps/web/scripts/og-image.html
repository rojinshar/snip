<!doctype html>
<!--
  Source for public/og.png, the 1200x630 link-preview image. Regenerate from apps/web with:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --window-size=1200,630 --virtual-time-budget=5000 --screenshot=public/og.png \
    "file://$PWD/scripts/og-image.html"
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=JetBrains+Mono&display=block"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #fff;
        color: #0f172a; /* slate-900 */
        font-family: Inter, sans-serif;
        padding: 64px 72px;
        display: flex;
        flex-direction: column;
      }
      .brand {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      h1 {
        margin-top: 28px;
        font-size: 68px;
        line-height: 1.05;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .demo {
        margin-top: auto;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 24px;
        padding: 28px;
        border: 1px solid #e2e8f0; /* slate-200 */
        border-radius: 20px;
        background: #f8fafc; /* slate-50 */
      }
      .screen {
        border: 3px dashed #818cf8; /* indigo-400 */
        border-radius: 10px;
        background: #fff;
        padding: 8px;
      }
      .screen img {
        display: block;
        width: 100%;
      }
      .arrow {
        font-size: 36px;
        color: #94a3b8; /* slate-400 */
      }
      pre {
        border-radius: 10px;
        background: #0f172a;
        color: #f1f5f9;
        padding: 22px;
        font:
          22px/1.4 'JetBrains Mono',
          monospace;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div class="brand">Snip</div>
    <h1>Screenshot any equation.<br />Paste LaTeX.</h1>
    <div class="demo">
      <div class="screen"><img src="../public/demo-equation.png" alt="" /></div>
      <div class="arrow">→</div>
      <pre>
\int_{-\infty}^{\infty}
e^{-x^2}\,dx = \sqrt{\pi}</pre>
    </div>
  </body>
</html>
